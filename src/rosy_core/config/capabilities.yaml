# CAP-001 advertisement for the packaged default: profile.pinky_pro.yaml
# plus runtime.mode core (rosy_default.yaml). HWA-003: this file must equal
# derive_capability(profile, mode). Do not advertise slam/swarm/teleop here;
# those flags belong to motor/hardware overlays under deploy/robot/config/.
capability_version: 1
navigation:
  goal_navigation: false
  return_home: false
  max_linear_velocity: 0.20
  max_angular_velocity: 0.80
teleop: false
slam: false
swarm:
  follow: false
  lead: false
docking:
  supported: false
sensors: []
events: ["safety.*", "mode.*", "waypoint.*", "system.*", "command.*"]
api_versions: [v1]
protocol_version: "1.0"
