name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ros:jazzy-ros-base
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix git safe directory (container)
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Install colcon & tools
        run: |
          apt-get update -qq
          # openssl: the release signing contract requires OpenSSL 3 raw Ed25519.
          # Installed explicitly so a slimmer base image cannot silently remove it.
          apt-get install -y -qq python3-colcon-common-extensions python3-pip openssl zstd
          pip3 install --no-cache-dir flake8 pydantic fastapi uvicorn httpx websockets pyyaml

      - name: Build (colcon)
        run: |
          cd src
          colcon build --symlink-install --event-handlers console_direct+

      - name: Lint (flake8)
        run: |
          cd src
          flake8 rosy_core/rosy_core rosy_fleet/rosy_fleet rosy_gz_sim/launch --count --max-line-length=120 --show-source --statistics || true

      - name: Test (rosy_core protocol schemas, P1-19)
        run: |
          cd src/rosy_core
          python3 -m pytest test/ -v

      # rosy_fleet 은 ROS 를 import 하지 않는다. conftest 가 src/rosy_core 를 sys.path 에
      # 얹으므로 colcon 오버레이 없이도 돈다 — Windows 개발 환경과 같은 조건이다.
      - name: Test (rosy_fleet formation, relay, session)
        run: python3 -m pytest src/rosy_fleet/test/ -v

      # 멀티 인스턴스 런치는 로봇마다 포트·HOME·설정을 갈라야 한다. 그 계약은 런치
      # 파일을 실제로 실행해야 검증되므로 ROS 오버레이가 필요하다. ros_gz_sim share 가
      # 없는 러너에서는 테스트가 스스로 skip 한다 — 조용히 통과하는 것이 아니라
      # skip 으로 드러난다.
      - name: Test (rosy_gz_sim multi-instance launch)
        run: |
          # ROS setup.sh 는 미정의 변수를 참조하므로 -u 를 쓰지 않는다.
          set -eo pipefail
          . /opt/ros/jazzy/setup.sh
          . src/install/setup.sh
          python3 -m pytest src/rosy_gz_sim/test -v

      # 루트 test/ 는 배포·릴리스 계약을 담고 있으면서도 지금까지 CI 에서 한 번도
      # 실행되지 않았다. 위 스텝이 src/rosy_core/test 만 돌기 때문이다. 그래서
      # compose 권한 경계와 Wi-Fi 배포 계약이 검증 없이 지나갔다.
      # ROS 오버레이는 필요 없다 — test_motor_control.py 가 직접 sys.path 를 잡는다.
      - name: Test (deployment and release contracts)
        run: python3 -m pytest test/ -v

      # 호스트 테스트는 ros_bridge 를 임포트하지 않으므로, 모듈 최상단의 ROS
      # 임포트가 노드 생성자를 죽이는 결함을 잡지 못한다. 이 러너에는
      # slam_toolbox 가 없어 그 조건이 그대로 재현된다.
      - name: Smoke (node boots without optional ROS packages)
        run: |
          # ROS setup.sh 는 미정의 변수를 참조하므로 -u 를 쓰지 않는다.
          set -eo pipefail
          . /opt/ros/jazzy/setup.sh
          . src/install/setup.sh
          export HOME=/tmp ROS_LOG_DIR=/tmp/ros-logs
          timeout 60 ros2 run rosy_core rosy_core > /tmp/boot.log 2>&1 &
          node_pid=$!
          for _ in $(seq 1 60); do
            grep -q 'rosy_core up' /tmp/boot.log && break
            kill -0 "$node_pid" 2>/dev/null || break
            sleep 1
          done
          kill "$node_pid" 2>/dev/null || true
          cat /tmp/boot.log
          if ! grep -q 'rosy_core up' /tmp/boot.log; then
            echo '::error::rosy_core did not reach startup'
            exit 1
          fi
          # 러너가 slam_toolbox 를 갖게 되면 이 검사는 의도한 조건을 더 이상
          # 재현하지 못한다. 조용히 통과하지 말고 드러내야 한다.
          if ! grep -q 'slam_toolbox unavailable' /tmp/boot.log; then
            echo '::error::precondition lost: runner now has slam_toolbox'
            exit 1
          fi

      # save_map 의 두 수정(std_msgs/String, RESULT_SUCCESS=0)은 실패하면 예외가
      # 아니라 SIGABRT 다. 호스트 테스트로는 잡히지 않으므로 실제 타입으로 검사한다.
      # 전체 설치(Qt/assimp 의존성)는 무겁다 — deb 만 받아 풀면 바인딩이 임포트된다.
      - name: Guard (SaveMap request type and result codes)
        run: |
          set -eo pipefail
          . /opt/ros/jazzy/setup.sh
          cd /tmp
          apt-get update -qq
          apt-get download ros-jazzy-slam-toolbox
          dpkg -x ros-jazzy-slam-toolbox_*.deb /
          python3 - <<'PY'
          from slam_toolbox.srv import SaveMap
          from std_msgs.msg import String
          from rclpy.serialization import serialize_message

          fields = SaveMap.Request.get_fields_and_field_types()
          assert fields['name'] == 'std_msgs/String', fields
          assert SaveMap.Response.RESULT_SUCCESS == 0, 'success code changed'

          # ros_bridge.save_map 이 만드는 형태 그대로. 원시 str 이었다면 여기서
          # convert_from_py assertion 으로 프로세스가 죽는다.
          request = SaveMap.Request()
          request.name = String(data='ci-map')
          assert serialize_message(request)
          print('SaveMap guard OK')
          PY
