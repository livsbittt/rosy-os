name: arm64 rehearsal

# D-140: ARTIFACT gate 의 코드 수준 선검증 — QEMU 대신 네이티브 arm64 에서 소스
# 빌드와 ROS-free 스위트를 매주 실행한다 (D-66/D-78 의 '네이티브' 요건; 이미지
# 빌드 자체는 deploy/image 소관). 실패는 ARTIFACT 진입 전에 발견하는 것이 목적이므로
# 게이팅이 아니다 (continue-on-error).

on:
  schedule:
    - cron: "41 3 * * 4"
  workflow_dispatch:

jobs:
  native-arm64:
    continue-on-error: true
    timeout-minutes: 90
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install ROS 2 Jazzy base (arm64)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl ca-certificates
          curl -fsSL https://raw.githubusercontent.com/ros/rosdistro/master/ros.key | sudo tee /usr/share/keyrings/ros-archive-keyring.gpg > /dev/null
          echo "deb [arch=arm64 signed-by=/usr/share/keyrings/ros-archive-keyring.gpg] http://packages.ros.org/ros2/ubuntu noble main" | sudo tee /etc/apt/sources.list.d/ros2.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq ros-jazzy-ros-base python3-colcon-common-extensions python3-pip openssl

      - name: Install python deps
        run: |
          python3 -m pip install --break-system-packages --no-cache-dir pydantic fastapi uvicorn httpx websockets pyyaml

      - name: Build (colcon, native arm64)
        run: |
          source /opt/ros/jazzy/setup.sh
          cd src
          colcon build --symlink-install --event-handlers console_direct+

      - name: Core suite (ROS-free pytest, native arm64)
        run: |
          source /opt/ros/jazzy/setup.sh
          source src/install/setup.sh
          python3 -m pytest src/core/core/test/ -q
