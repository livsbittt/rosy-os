# ROSY OS v1 이미지 고정 입력 (설계 §7.2)
#
# 재현성 목표는 **동일한 입력과 provenance 를 증명하는 것**이다.
# bit-for-bit 동일 이미지는 별도 검증이 통과하기 전까지 주장하지 않는다.
#
# `verified: false` 인 항목은 **아직 아무도 확인하지 않은 가정**이다. WP-6 착수
# 시 버리는 이미지 한 장으로 먼저 확인하고, 확인한 값으로 교체하면서
# `verified: true` 로 바꾼다. 하나라도 어긋나면 manifest 의 target.os_suite
# 부터 바뀌므로, 빌드 스크립트를 쓰기 전에 확인하는 편이 싸다.
#
# 관련: docs/deployment/pi5-acceptance-checklist.md §2

schema_version: 1

board:
  name: pinky_pro
  host: raspberry-pi-5
  first_runtime: core
  note: >-
    First ROSY OS board support. Runtime overlays live in
    deploy/robot/config/capabilities.{core,motor,hardware}.yaml.

image_tool:
  name: rpi-image-gen
  repository: https://github.com/raspberrypi/rpi-image-gen
  tag: v2.7.0
  # 전체 commit SHA. tag 는 옮겨질 수 있으므로 SHA 가 실제 고정이다.
  commit: null
  verified: false
  note: >-
    v2.7.0 이 필요한 일을 하는지 아직 확인되지 않았다. 확인 후 commit 을 채운다.

os:
  family: raspberry-pi-os-lite
  architecture: arm64
  suite: trixie
  verified: false
  note: >-
    Raspberry Pi OS Lite arm64 trixie 가 릴리스 대상으로 준비되어 있는지 미확인.
    준비되지 않았다면 bookworm 으로 후퇴하고 설계 §6/§7.1 의 suite 표기와
    manifest 의 target.os_suite 를 함께 고친다.
  apt_sources:
    - deb http://deb.debian.org/debian trixie main contrib non-free-firmware
    - deb http://archive.raspberrypi.com/debian trixie main

container_runtime:
  engine: docker-ce
  apt_repository: https://download.docker.com/linux/debian
  engine_version: null
  compose_plugin_version: null
  verified: false
  note: >-
    Docker apt 저장소에 trixie suite 가 올라와 있는지 미확인. 현재
    deploy/robot/install-pi.sh 가 이 경로를 쓴다. 없으면 os.suite 후퇴가 필요하다.

ros:
  distribution: jazzy
  base_image: ros:jazzy-ros-base
  # arm64 매니페스트의 digest. 태그는 움직이므로 digest 로만 고정한다.
  base_image_digest: null
  verified: false

containers:
  # deploy/robot/Dockerfile 이 만드는 두 이미지. rosy_io 하나를 rosy-motor 와
  # rosy-io 두 Compose service 가 공유한다 (설계 §6).
  rosy_core_digest: null
  rosy_io_digest: null
  verified: false

accounts:
  # Host Agent 계약 §3 의 전제 조건. CORE 가 로그인 계정과 같은 uid 로 돌면
  # SO_PEERCRED 는 SSH 세션 이상을 증명하지 못한다.
  # image_checks.check_core_account 가 이미지에서 이것을 검사한다.
  core_user: rosy
  core_uid: 960
  core_gid: 960
  login_uid_must_differ: true

sources:
  # 이미지 layer 와 hook 의 Git revision. 빌드 시점에 채운다.
  rosy_revision: null

provenance:
  # 패키지 저장소가 갱신되면 같은 소스에서 다른 이미지가 나온다. 그래서
  # 빌드 시점의 패키지 버전 목록과 repository metadata 를 산출물에 보존한다.
  record_installed_packages: true
  record_apt_repository_metadata: true
  record_build_host: true
