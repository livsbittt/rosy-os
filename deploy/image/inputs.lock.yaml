# ROSY OS v1 product-image inputs (D-161)
#
# The product target is Ubuntu Server 24.04 LTS arm64 with native ROS 2 Jazzy.
# Any `null` or `verified: false` value is an explicit release blocker. Replace
# it only with evidence captured on the native ARM64 build host.

schema_version: 1

board:
  name: pinky_pro
  host: raspberry-pi-5
  first_runtime: core
  note: >-
    First ROSY OS board support. Runtime overlays live in
    deploy/robot/config/capabilities.{core,motor,hardware}.yaml.

image_tool:
  name: rosy-ubuntu-image-builder
  repository: in-tree:deploy/image
  commit: null
  verified: false
  note: >-
    Pin this repository revision after the Ubuntu image builder is implemented
    and proven on the native ARM64 release host.

base_image:
  publisher: Canonical
  product: ubuntu-server
  variant: preinstalled-server-arm64+raspi
  url: null
  sha256: null
  verified: false
  note: >-
    Record the exact official Ubuntu image URL and published SHA-256 before a
    release artifact may be built.

os:
  family: ubuntu-server
  release: "24.04"
  codename: noble
  architecture: arm64
  variant: preinstalled-server-arm64+raspi
  suite: noble
  verified: false
  apt_sources:
    - deb http://ports.ubuntu.com/ubuntu-ports noble main restricted universe multiverse
    - deb http://ports.ubuntu.com/ubuntu-ports noble-updates main restricted universe multiverse
    - deb http://ports.ubuntu.com/ubuntu-ports noble-security main restricted universe multiverse

runtime:
  model: native-systemd
  service_manager: systemd
  container_runtime_required: false

ros:
  distribution: jazzy
  installation: native-deb
  architecture: arm64
  apt_repository: http://packages.ros.org/ros2/ubuntu
  apt_key_fingerprint: null
  verified: false

containers:
  role: development-and-ci-only
  excluded_from_product_artifact: true

rosy_packages:
  required:
    - interfaces
    - core
    - bringup
    - description
    - navigation
    - control
    - omx_adapter
    - led
    - sensor_adc
    - lamp_control
    - emotion
    - imu_bno055
  install_root: /opt/rosy/releases
  offline_first_boot: true
  inventory_required: true
  ros2_pkg_prefix_required: true

accounts:
  core_user: rosy-core
  core_uid: 960
  core_gid: 960
  io_user: rosy-io
  io_uid: 961
  io_gid: 961
  login_uid_must_differ: true

sources:
  rosy_revision: null

provenance:
  record_installed_packages: true
  record_apt_repository_metadata: true
  record_build_host: true
  record_rosy_package_inventory: true
