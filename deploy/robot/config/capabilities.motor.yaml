# Pinky Pro board support — runtime mode `motor`.
# Dynamixel UART only. LiDAR and Nav2 stay off until hardware acceptance.
capability_version: 1
navigation:
  goal_navigation: false
  return_home: false
  max_linear_velocity: 0.20
  max_angular_velocity: 0.80
teleop: true
slam: false
swarm:
  follow: false
  lead: false
docking:
  supported: false
sensors: [encoder]
events: ["safety.*", "mode.*", "waypoint.*", "system.*", "command.*"]
api_versions: [v1]
protocol_version: "1.0"
