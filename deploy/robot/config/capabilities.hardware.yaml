# Pinky Pro board support — runtime mode `hardware`.
# Motor + RPLidar. Nav2/SLAM are not in the image yet.
capability_version: 1
navigation:
  goal_navigation: false
  return_home: false
  max_linear_velocity: 0.20
  max_angular_velocity: 0.80
teleop: true
slam: false
swarm:
  follow: false
  lead: false
docking:
  supported: false
sensors: [lidar, encoder]
events: ["safety.*", "mode.*", "waypoint.*", "system.*", "command.*"]
api_versions: [v1]
protocol_version: "1.0"
